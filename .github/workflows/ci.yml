# #65: CI definition. NOT RUN YET (the repository was never pushed when this was written).
# Model files are not in the repository; tests that need them skip when SAJEEV_MODELS is not set.
name: ci
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17', cache: maven }
      - name: Build and test (coverage report in each module's target/site/jacoco)
        run: mvn -B -pl liveness-api,liveness-core,devices,bench,eval test
      - name: Keep the coverage report
        uses: actions/upload-artifact@v4
        with: { name: jacoco, path: '**/target/site/jacoco' }
