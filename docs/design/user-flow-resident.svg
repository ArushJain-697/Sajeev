<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1100" width="1200" height="1100" role="img" aria-label="Resident face capture flow: passive check first; two attack votes refuse; evidence of life goes straight to capture; otherwise a random challenge; the capture is stored only if it is the same face seen live; failures show the PS4 messages and allow a retry until the limit, then the recovery process.">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2A37"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6DB4"/></marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4690E"/></marker>
    <marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B6672"/></marker>
  </defs>
  <rect x="0" y="0" width="1200" height="1100" fill="#FFFFFF"/>
  <g font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" fill="#1F2A37">

    <!-- start -->
    <rect x="180" y="30" width="300" height="52" rx="26" fill="#F7F9FB" stroke="#1F2A37" stroke-width="1.6"/>
    <text x="330" y="62" font-size="16" font-weight="700" text-anchor="middle">Operator starts face capture</text>
    <line x1="330" y1="82" x2="330" y2="114" stroke="#1F2A37" stroke-width="1.6" marker-end="url(#a)"/>

    <!-- preview -->
    <rect x="180" y="116" width="300" height="70" rx="6" fill="#FFFFFF" stroke="#9AA5B1"/>
    <text x="330" y="144" font-size="15" font-weight="700" text-anchor="middle">Live preview, face oval</text>
    <text x="330" y="168" font-size="14" fill="#5B6672" text-anchor="middle">“Checking face liveness…”</text>
    <line x1="330" y1="186" x2="330" y2="200" stroke="#1F2A37" stroke-width="1.6" marker-end="url(#a)"/>

    <!-- usable face? -->
    <polygon points="330,202 440,250 330,298 220,250" fill="#FFFFFF" stroke="#1F2A37" stroke-width="1.6"/>
    <text x="330" y="246" font-size="14" font-weight="700" text-anchor="middle">One usable</text>
    <text x="330" y="264" font-size="14" font-weight="700" text-anchor="middle">face?</text>
    <line x1="440" y1="250" x2="558" y2="250" stroke="#5B6672" stroke-width="1.6" marker-end="url(#am)"/>
    <text x="454" y="242" font-size="13" fill="#5B6672">no</text>
    <rect x="560" y="222" width="300" height="56" rx="6" fill="#F7F9FB" stroke="#9AA5B1"/>
    <text x="574" y="246" font-size="14" font-weight="700">Guidance on screen</text>
    <text x="574" y="266" font-size="13" fill="#5B6672">move closer, more light, one person only</text>
    <path d="M710,222 L710,151 L482,151" fill="none" stroke="#5B6672" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#am)"/>
    <text x="596" y="143" font-size="13" fill="#5B6672">keeps watching</text>
    <line x1="330" y1="298" x2="330" y2="328" stroke="#1F2A37" stroke-width="1.6" marker-end="url(#a)"/>
    <text x="340" y="318" font-size="13" fill="#5B6672">yes</text>

    <!-- passive -->
    <rect x="180" y="330" width="300" height="64" rx="6" fill="#FFFFFF" stroke="#9AA5B1"/>
    <text x="330" y="356" font-size="15" font-weight="700" text-anchor="middle">Passive check, no action needed</text>
    <text x="330" y="378" font-size="13" fill="#5B6672" text-anchor="middle">six voters watch for up to 5 s</text>
    <line x1="330" y1="394" x2="330" y2="420" stroke="#1F2A37" stroke-width="1.6" marker-end="url(#a)"/>

    <!-- attack? -->
    <polygon points="330,422 440,470 330,518 220,470" fill="#FFFFFF" stroke="#1F2A37" stroke-width="1.6"/>
    <text x="330" y="466" font-size="14" font-weight="700" text-anchor="middle">Two attack</text>
    <text x="330" y="484" font-size="14" font-weight="700" text-anchor="middle">votes?</text>
    <path d="M440,470 L1035,470 L1035,638" fill="none" stroke="#B4690E" stroke-width="1.8" marker-end="url(#aa)"/>
    <text x="454" y="462" font-size="13" fill="#B4690E">yes</text>
    <line x1="330" y1="518" x2="330" y2="550" stroke="#1F2A37" stroke-width="1.6" marker-end="url(#a)"/>
    <text x="340" y="540" font-size="13" fill="#5B6672">no</text>

    <!-- evidence of life? -->
    <polygon points="330,552 440,600 330,648 220,600" fill="#FFFFFF" stroke="#1F2A37" stroke-width="1.6"/>
    <text x="330" y="596" font-size="14" font-weight="700" text-anchor="middle">Evidence</text>
    <text x="330" y="614" font-size="14" font-weight="700" text-anchor="middle">of life?</text>
    <line x1="440" y1="600" x2="558" y2="600" stroke="#1F2A37" stroke-width="1.6" marker-end="url(#a)"/>
    <text x="454" y="592" font-size="13" fill="#5B6672">not enough</text>

    <!-- challenge -->
    <rect x="560" y="568" width="300" height="72" rx="6" fill="#FFFFFF" stroke="#1F2A37" stroke-width="1.6"/>
    <text x="574" y="594" font-size="15" font-weight="700">Random challenge, two prompts</text>
    <text x="574" y="616" font-size="13" fill="#5B6672">“Please turn your head to the left”</text>
    <text x="574" y="632" font-size="13" fill="#5B6672">then “Action detected”, “Hold still”</text>
    <line x1="710" y1="640" x2="710" y2="670" stroke="#1F2A37" stroke-width="1.6" marker-end="url(#a)"/>

    <polygon points="710,672 820,720 710,768 600,720" fill="#FFFFFF" stroke="#1F2A37" stroke-width="1.6"/>
    <text x="710" y="716" font-size="14" font-weight="700" text-anchor="middle">Done in time,</text>
    <text x="710" y="734" font-size="14" font-weight="700" text-anchor="middle">no attack?</text>
    <line x1="820" y1="720" x2="878" y2="720" stroke="#B4690E" stroke-width="1.8" marker-end="url(#aa)"/>
    <text x="830" y="712" font-size="13" fill="#B4690E">no</text>
    <path d="M710,768 L710,822 L482,822" fill="none" stroke="#2E6DB4" stroke-width="1.8" marker-end="url(#ab)"/>
    <text x="720" y="792" font-size="13" fill="#2E6DB4">yes</text>

    <line x1="330" y1="648" x2="330" y2="788" stroke="#2E6DB4" stroke-width="1.8" marker-end="url(#ab)"/>
    <text x="340" y="676" font-size="13" fill="#2E6DB4">yes</text>

    <!-- capture -->
    <rect x="180" y="790" width="300" height="64" rx="6" fill="#FFFFFF" stroke="#9AA5B1"/>
    <text x="330" y="816" font-size="15" font-weight="700" text-anchor="middle">Device takes the photo</text>
    <text x="330" y="838" font-size="13" fill="#5B6672" text-anchor="middle">signed capture, stream paused</text>
    <line x1="330" y1="854" x2="330" y2="880" stroke="#1F2A37" stroke-width="1.6" marker-end="url(#a)"/>

    <!-- same face? -->
    <polygon points="330,882 440,930 330,978 220,930" fill="#FFFFFF" stroke="#2E6DB4" stroke-width="1.8"/>
    <text x="330" y="926" font-size="14" font-weight="700" text-anchor="middle">Same face</text>
    <text x="330" y="944" font-size="14" font-weight="700" text-anchor="middle">as seen live?</text>
    <path d="M440,930 L860,930 L860,740 L878,740" fill="none" stroke="#B4690E" stroke-width="1.8" marker-end="url(#aa)"/>
    <text x="454" y="922" font-size="13" fill="#B4690E">no</text>
    <line x1="330" y1="978" x2="330" y2="1010" stroke="#2E6DB4" stroke-width="1.8" marker-end="url(#ab)"/>
    <text x="340" y="1000" font-size="13" fill="#2E6DB4">yes</text>

    <rect x="180" y="1012" width="300" height="60" rx="30" fill="#EAF1F9" stroke="#2E6DB4" stroke-width="1.8"/>
    <text x="330" y="1038" font-size="15" font-weight="700" fill="#1F4F86" text-anchor="middle">Face stored</text>
    <text x="330" y="1058" font-size="13" fill="#1F4F86" text-anchor="middle">“Good, face captured successfully”</text>

    <!-- failure -->
    <rect x="880" y="640" width="290" height="120" rx="6" fill="#FBF1E4" stroke="#B4690E" stroke-width="1.8"/>
    <text x="894" y="666" font-size="15" font-weight="700" fill="#7A4508">Not verified, nothing stored</text>
    <text x="894" y="690" font-size="13" fill="#7A4508">“We could not verify face liveness.</text>
    <text x="894" y="708" font-size="13" fill="#7A4508">Please try again.” An attack gets the</text>
    <text x="894" y="726" font-size="13" fill="#7A4508">generic PAD message, no details.</text>
    <text x="894" y="748" font-size="13" fill="#7A4508">Shows “Attempt 2 of 3”.</text>

    <path d="M1170,700 L1188,700 L1188,56 L482,56" fill="none" stroke="#5B6672" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#am)"/>
    <text x="1010" y="48" font-size="13" fill="#5B6672">retry, new random prompts</text>

    <line x1="1025" y1="760" x2="1025" y2="828" stroke="#B4690E" stroke-width="1.8" marker-end="url(#aa)"/>
    <text x="1035" y="800" font-size="13" fill="#B4690E">no attempts left</text>
    <rect x="880" y="830" width="290" height="64" rx="30" fill="#FBF1E4" stroke="#B4690E" stroke-width="1.8"/>
    <text x="1025" y="856" font-size="15" font-weight="700" fill="#7A4508" text-anchor="middle">Could not be completed</text>
    <text x="1025" y="878" font-size="13" fill="#7A4508" text-anchor="middle">guide to the recovery process</text>
  </g>
</svg>
